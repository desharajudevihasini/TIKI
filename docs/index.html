.proposal[hidden]{display:none}.proposal-title{font-size:12px;font-weight:700;color:#f5c0c9}.proposal-items{font-size:12px;color:#c7bfc6;line-height:1.55;margin:8px 0;white-space:pre-wrap}
.proposal-actions{display:flex;gap:8px}.proposal-actions button{background:#b22f47;border:1px solid #cb4a60;border-radius:7px;padding:9px 12px;color:#fff;font-size:12px}.proposal-actions button+button{background:transparent;color:#b4a8af;border-color:#4e3b43}
.searchbox{display:flex;gap:8px;margin:10px 0!important}.searchbox input{flex:1;background:#141217;color:#fff;border:1px solid #4b3b46;border-radius:8px;padding:9px;min-width:0;font-size:12px}.searchbox button{padding:7px 11px;border-radius:8px;background:#3d2b36;color:#f0dce1;border:0;font-size:12px}
.item.photo-item{display:grid;grid-template-columns:86px 1fr auto;align-items:start;gap:12px}.photo-thumb{width:84px;height:80px;object-fit:cover;border-radius:9px;border:1px solid #50414b;cursor:pointer}.item.photo-item strong{padding:0}.item.photo-item p{margin:6px 0 0;max-height:120px;overflow:auto}.item.photo-item button.delete{position:static;font-size:22px}.item .meta{color:#8d818e;font-size:10px}
.due-label{color:#9f929f;display:flex;gap:10px;align-items:center;margin:10px 0;font-size:11px}.due-label input{background:#141217;border:1px solid #50414b;border-radius:7px;color:#faf3f6;padding:8px;font-size:12px}
.drawer-actions{display:flex;flex-wrap:wrap;gap:4px 15px;margin-top:15px;border-top:1px solid #3b2e39;padding-top:7px}.drawer-actions button{text-align:left}.tabs{flex-wrap:wrap}.tabs button{padding:8px 13px}.captured-photo{cursor:zoom-in}
@media(max-width:640px){.proposal{width:100%}.item.photo-item{grid-template-columns:70px 1fr auto}.photo-thumb{width:68px;height:70px}.due-label{flex-wrap:wrap}}

/* Hidden controls must remain hidden even when a layout selector uses display:flex. */
[hidden]{display:none!important}


/* TIKI mascot edition: use the supplied character as the main logo.
   These visual updates do not alter microphone, button, photo, or speaker logic. */
:root { --red: #fa4569; --bg: #0f0e14; }
body {
  background:
    radial-gradient(ellipse 410px 270px at 50% 39%, rgba(145,21,61,.105), transparent 80%),
    radial-gradient(ellipse 700px 470px at 94% -12%, rgba(125,24,56,.10), transparent 82%),
    var(--bg);
}
.wordmark{display:flex;align-items:center;gap:8px;line-height:1;font-size:25px;letter-spacing:-1.8px}
.wordmark .brand-icon{width:34px;height:34px;object-fit:cover;filter:drop-shadow(0 0 7px rgba(249,61,105,.2))}
.eyebrow{letter-spacing:.20em;color:#ad9ba9}
.mascot-stage{
  position:relative;
  display:grid;
  place-items:center;
  width:clamp(260px, 31vw, 365px);
  height:clamp(260px, 31vw, 365px);
  margin:15px 0 5px;
  isolation:isolate;
  transition:filter .25s ease;
}
.mascot-stage:before {
  content:'';position:absolute;z-index:-3;
  width:67%;height:70%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(240,35,91,.15),transparent 70%);
  filter:blur(27px);
  animation:mascot-breath 5.2s ease-in-out infinite;
}
.mascot-stage .mascot-ring{
  position:absolute;z-index:-2;width:79%;height:79%;
  border:1px solid rgba(255,73,109,.13);border-radius:50%;
  box-shadow:0 0 18px rgba(230,43,86,.05);
}
.mascot-stage .mascot-ring-2{width:94%;height:94%;border-color:rgba(255,73,109,.055)}
.mascot-img{
  z-index:2;display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 17px 25px rgba(4,1,9,.35));
  animation:mascot-hover 5s ease-in-out infinite;
  transform-origin:50% 43%;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.mascot-shadow{position:absolute;bottom:1%;left:26%;width:48%;height:7%;border-radius:50%;background:#0007;filter:blur(20px);z-index:-1}
@keyframes mascot-hover{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.7deg)}}
@keyframes mascot-breath{50%{transform:scale(1.18);opacity:.6}}
@keyframes mascot-talk{0%,100%{transform:translateY(-1px) scale(1)}50%{transform:translateY(-7px) scale(1.035)}}
@keyframes mascot-listen{50%{transform:scale(1.035);box-shadow:0 0 25px rgba(255,70,120,.22)}}
@keyframes mascot-think{to{transform:rotate(360deg)}}
.mascot-stage[data-mode="listening"] .mascot-ring-1,
.mascot-stage[data-mode="awake"] .mascot-ring-1{
 border-color:rgba(255,88,122,.7);animation:mascot-listen 1.2s ease-in-out infinite;
}
.mascot-stage[data-mode="thinking"] .mascot-ring-1,
.mascot-stage[data-mode="looking"] .mascot-ring-1{
 border-color:rgba(255,88,122,.5);border-top-color:transparent;
 animation:mascot-think 1.8s linear infinite;
}
.mascot-stage[data-mode="speaking"] .mascot-img{animation:mascot-talk .7s ease-in-out infinite}
.mascot-stage[data-mode="error"]{filter:saturate(.5)}
.hero{min-height:650px}
h1{font-size:clamp(32px,3.5vw,44px);font-weight:700;letter-spacing:-.06em}
.talk{margin-top:14px;box-shadow:0 12px 42px rgba(200,22,67,.28)}
.talk:hover{filter:brightness(1.07);transform:translateY(-1px)}
@media(max-width:640px){
  .shell{padding:18px 22px}
  .hero{min-height:0;padding:15px 0 22px}
  .mascot-stage{width:min(76vw,310px);height:min(76vw,310px);margin:12px 0 3px}
  .eyebrow{font-size:9px}
  h1{font-size:34px;max-width:330px}
  .talk{margin-top:13px}
  .wake{margin-top:23px}
}
@media(prefers-reduced-motion:reduce){
 .mascot-img,.mascot-stage:before,.mascot-ring{animation:none!important;transition:none!important}
}

        <div class="mascot-shadow" aria-hidden="true"></div>
      </div>
      <h1>Your little superpower.</h1>
      <p id="status" role="status" aria-live="polite">Connecting to your glasses…</p>
      <div class="transcript" id="heard" aria-live="polite"></div><button id="correctTranscript" class="tiny-action" type="button" hidden>Correct what TIKI heard</button>
      <img id="lastPhoto" class="captured-photo" alt="Photo just captured by TIKI glasses" hidden />
      <p id="answer" class="answer" aria-live="polite"></p>
      <div class="proposal" id="proposal" hidden aria-live="polite">
        <div class="proposal-title">Possible tasks from your photo</div>
        <div id="proposalItems" class="proposal-items"></div>
        <div class="proposal-actions"><button type="button" id="approveTasks">Save tasks</button><button type="button" id="rejectTasks">Not now</button></div>
      </div>
      <button id="talkBtn" class="talk" type="button"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg><span id="talkText">Talk to TIKI</span></button>
      <div class="smallhelp" id="help">Tap Talk to speak. The physical glasses button is camera-only.</div>
      <label class="wake"><input type="checkbox" id="wakeToggle"><span class="track"></span><span>Hey TIKI, spots on</span></label>
      <details class="fallback"><summary>Type a message</summary><form id="typeForm"><input id="typeText" autocomplete="off" placeholder="Tell TIKI something" maxlength="1000" aria-label="Message"/><button type="submit">Send</button></form></details>
    </section>
    <footer><span id="connectLight" class="connection-dot"></span><span id="deviceLabel">Checking hardware</span><span class="footnote">TIKI captures a photo only when you press the camera button.</span></footer>
  </main>
  <div class="scrim" id="drawer" hidden><section class="drawer" role="dialog" aria-modal="true" aria-label="Notes and plans"><div class="drawerhead"><strong>Saved by TIKI</strong><button type="button" id="closeDrawer" aria-label="Close">×</button></div><div class="tabs"><button type="button" data-category="reminders" class="on">Plans</button><button type="button" data-category="notes">Notes</button><button type="button" data-category="memories">Memories</button><button type="button" data-category="captures">Photos</button></div><form id="searchForm" class="searchbox"><input id="searchText" placeholder="Search saved moments and notes" aria-label="Search memories" maxlength="300"/><button type="submit" aria-label="Search">Search</button></form><div id="items" class="items"></div><form id="saveForm"><input id="saveText" placeholder="Add a plan" maxlength="500" required><button type="submit">Save</button></form>
      <label class="due-label" id="dueWrap">Optional reminder date and time <input id="dueInput" type="datetime-local" /></label>
      <div class="drawer-actions"><button class="quiet-test" id="takePhonePhoto" type="button">Share a phone photo</button><button class="quiet-test" id="exportBackup" type="button">Export memory backup</button><button class="quiet-test" id="testSpeaker" type="button">Test glasses speaker</button></div>
      <input type="file" id="phonePhoto" accept="image/*" capture="environment" hidden /></section></div>
  <script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const liveNote = 'This public preview shows TIKI’s original interface. Voice, vision, and memory run in the local Mac app when connected to the glasses.';
function status(text, mode='ready') { $('status').textContent = text; $('character').dataset.mode = mode; }
status('Meet TIKI · Wearable AI companion', 'ready');
$('deviceLabel').textContent = 'Public preview · Hardware offline';
$('help').textContent = 'See TIKI in action in the real hardware demo below.';
$('answer').textContent = '';
$('wakeToggle').checked = false;
$('wakeToggle').disabled = true;
$('wakeToggle').title = 'Offline wake phrase is available in the locally running application.';
const originalFooter = document.querySelector('footer .footnote');
if(originalFooter) originalFooter.textContent = 'The live version runs privately with the ESP32-S3 glasses and Mac.';
const demo = document.createElement('section');
demo.setAttribute('aria-label','TIKI hardware demonstration');
demo.style.cssText='width:min(100%,580px);margin:24px auto 8px;text-align:center;';
demo.innerHTML = `<details style="padding:6px 0"><summary style="cursor:pointer;font-weight:600;letter-spacing:.02em">Watch the real TIKI demo · 25 seconds</summary><div style="margin-top:14px"><video controls playsinline preload="metadata" poster="media/tiki-demo-poster.jpg" style="width:100%;max-height:400px;border-radius:18px;display:block;background:#100b12"><source src="media/tiki-live-demo.mp4" type="video/mp4"/>Your browser does not support MP4 video.</video><p style="font-size:13px;opacity:.7;margin:12px 0 0">Real ESP32-S3 glasses prototype · No simulated AI responses</p></div></details>`;
document.querySelector('.hero').append(demo);
$('talkBtn').addEventListener('click',() => {
  status('See the real demo below', 'awake');
  $('answer').textContent = liveNote;
  demo.querySelector('details').open = true;
  demo.scrollIntoView({behavior:'smooth',block:'nearest'});
  window.setTimeout(()=>{$('character').dataset.mode='ready'},1800);
});
$('typeForm').addEventListener('submit',event=>{
  event.preventDefault();
  $('typeText').value='';
  $('answer').textContent=liveNote;
  status('Try the full app with TIKI hardware', 'ready');
});
$('correctTranscript').hidden=true;
$('worldBtn').addEventListener('click',()=>{
 $('drawer').hidden=false;
 document.querySelector('.scrim .drawer').scrollTop=0;
 renderLibrary();
});
$('closeDrawer').addEventListener('click',()=>{$('drawer').hidden=true;});
$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').hidden=true;});
$('saveForm').hidden=true;
$('dueWrap').hidden=true;
document.querySelector('.drawer-actions').hidden=true;
$('searchForm').hidden=true;
let selectedCategory='reminders';
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{
 selectedCategory=b.dataset.category;
 document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('on',x===b));
 renderLibrary();
}));
function renderLibrary(){
 const items=$('items');items.replaceChildren();
 if(selectedCategory!=='captures'){
   const p=document.createElement('p');p.textContent='Private '+selectedCategory+' stay on the local Mac. See the Photos tab for public hardware pictures.';
   items.append(p);return;
 }
 const photos=[
 ['TIKI glasses prototype','media/tiki-glasses-prototype.jpg'],
 ['ESP32-S3 camera and speaker hardware','media/tiki-hardware-closeup.jpg'],
 ['TIKI hardware demo frame','media/tiki-demo-poster.jpg']
 ];
 for(const [label,src] of photos){
   const article=document.createElement('article');article.className='item photo-item';
   const img=document.createElement('img');img.className='photo-thumb';img.alt=label;img.loading='lazy';img.src=src;
   img.style.cursor='pointer';img.onclick=()=>window.open(src,'_blank','noopener');
   const title=document.createElement('strong');title.textContent=label;
   article.append(img,title);items.append(article);
 }
 const p=document.createElement('p');p.textContent='Private photo memory is only available in the connected app.';items.append(p);
}
})();
</script>
